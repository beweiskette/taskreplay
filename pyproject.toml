[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "taskreplay"
version = "0.1.0"
description = "Benchmark coding agents on your own past tasks, replayed from git history in isolated worktrees."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "beweiskette" }]
dependencies = ["PyYAML>=6"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
taskreplay = "taskreplay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
